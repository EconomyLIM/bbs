spring.application.name=board

#dbms
#spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
#spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
#spring.datasource.username=root
#spring.datasource.password=1234

spring.datasource.url=jdbc:h2:tcp://localhost/~/test
spring.datasource.username=sa
spring.datasource.password=
spring.data.jdbc.dialect=oracle

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.hibernate.ddl-auto=create

#JPA log
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
logging.level.org.hibernate.resource.transaction=DEBUG

logging.level.org.hibernate.sql=DEBUG

#Swagger
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
springdoc.api-docs.groups.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# swagger-ui custom path
#springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.paths-to-match=/**

# JWT Configuration
jwt.access-secret=secretkeysecretkeysecretkeysecretkeysecretkeysecretkey
jwt.refresh-secret=secretkeysecretkeysecretkeysecretkeysecretkeysecretkeysecretkey
jwt.access-expiration=600000 # 10 min: 10min * 60 sec * 1000 millisecond
jwt.refresh-expiration=10800000 # 3 hours: 3hours * 60min * 60sec * 1000 millisecond
